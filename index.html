<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padel Event Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="app">

  <div class="section-label">MARCADOR</div>

  <section class="header-row">
    <div class="scoreboard">
      <div class="score-line">
        <span>Nosotros</span>
        <strong id="our-games">0</strong>
        <strong id="our-points">0</strong>
      </div>
      <div class="score-line">
        <span>Rivales</span>
        <strong id="rival-games">0</strong>
        <strong id="rival-points">0</strong>
      </div>
    </div>

    <select id="deuce-mode">
      <option value="ADVANTAGE">Ventajas</option>
      <option value="GOLDEN_POINT">P. oro</option>
    </select>
  </section>

  <div class="section-label">CRONÓMETRO</div>

  <section class="crono-row">
    <button id="toggle-crono">▶</button>
    <div id="crono-display">00:00</div>
    <button id="minus-crono">-5s</button>
    <button id="plus-crono">+5s</button>
  </section>

  <div class="section-label blue-label">SERVICIO Y RALLY</div>

  <section class="service-rally-row blue-block">
    <div class="service-group">
      <button id="server-toggle" class="toggle-btn active" data-value="J1">Saca J1</button>
      <button id="serve-number-toggle" class="toggle-btn active" data-value="1">1º</button>
    </div>

    <div class="service-divider"></div>

    <div class="rally-group">
      <button class="btn selected" data-rally="MENOS_3">&lt;3</button>
      <button class="btn" data-rally="ENTRE_3_6">3-6</button>
      <button class="btn" data-rally="MAS_6">&gt;6</button>
    </div>
  </section>

  <div class="section-label">CAUSA DEL PUNTO</div>

  <section class="cause-panel">

    <div class="cause-block cause-rival">
      <div class="cause-title">RIVAL</div>
      <div class="cause-row one">
        <button class="cause-btn selected" data-cause="G_NF_RIVAL">Ganado · NF rival</button>
      </div>
    </div>

    <div class="cause-block cause-j1">
      <div class="cause-title">J1</div>
      <div class="cause-row">
        <button class="cause-btn" data-cause="G_W_J1">G · Winner</button>
        <button class="cause-btn" data-cause="G_F_J1">G · Forzado</button>
        <button class="cause-btn" data-cause="P_NF_J1">P · NF</button>
        <button class="cause-btn" data-cause="P_F_J1">P · Forzado</button>
        <button class="cause-btn" data-cause="P_W_RIVAL_J1">P · Winner rival</button>
      </div>
    </div>

    <div class="cause-block cause-j2">
      <div class="cause-title">J2</div>
      <div class="cause-row">
        <button class="cause-btn" data-cause="G_W_J2">G · Winner</button>
        <button class="cause-btn" data-cause="G_F_J2">G · Forzado</button>
        <button class="cause-btn" data-cause="P_NF_J2">P · NF</button>
        <button class="cause-btn" data-cause="P_F_J2">P · Forzado</button>
        <button class="cause-btn" data-cause="P_W_RIVAL_J2">P · Winner rival</button>
      </div>
    </div>

  </section>

  <section id="players-stroke-area">

    <div class="section-label">CATEGORÍA GOLPE</div>

    <section class="category-buttons" id="category-buttons"></section>

    <div class="player-panel player-j1" id="panel-j1">
      <div class="player-title">
        <span>J1 · Golpe</span>
        <strong id="stroke-count-j1">0</strong>
      </div>
      <section class="stroke-buttons" id="stroke-buttons-j1"></section>
    </div>

    <div class="player-panel player-j2" id="panel-j2">
      <div class="player-title">
        <span>J2 · Golpe</span>
        <strong id="stroke-count-j2">0</strong>
      </div>
      <section class="stroke-buttons" id="stroke-buttons-j2"></section>
    </div>

  </section>

  <section id="zone-area">

    <div class="section-label">ZONA EN PISTA</div>

    <section class="court" id="padel-court">
      <button class="court-zone" data-zone="RED">RED</button>
      <button class="court-zone" data-zone="MEDIO">MEDIO</button>
      <button class="court-zone" data-zone="FONDO">FONDO</button>
    </section>

  </section>

  <section class="last-event" id="last-event">
    Sin eventos
  </section>

  <section class="bottom-row">
    <span>Eventos: <strong id="event-count">0</strong></span>
    <button id="reset-crono">Reset</button>
    <button id="undo-btn" disabled>Undo</button>
    <button id="export-btn" disabled>CSV</button>
  </section>

</main>

<script src="script.js"></script>

</body>
</html>
