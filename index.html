<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padel Event Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="app">

  <div class="section-label">MARCADOR</div>

  <section class="header-row">
    <div class="scoreboard">
      <div class="score-line">
        <span>Nosotros</span>
        <strong id="our-games">0</strong>
        <strong id="our-points">0</strong>
      </div>

      <div class="score-line">
        <span>Rivales</span>
        <strong id="rival-games">0</strong>
        <strong id="rival-points">0</strong>
      </div>
    </div>

    <select id="deuce-mode">
      <option value="ADVANTAGE">Ventajas</option>
      <option value="GOLDEN_POINT">P. oro</option>
    </select>
  </section>

  <div class="section-label">CRONÓMETRO</div>

  <section class="crono-row">
    <button id="toggle-crono">▶</button>

    <div id="crono-display">00:00</div>

    <button id="minus-crono">-5s</button>

    <button id="plus-crono">+5s</button>
  </section>

  <div class="section-label">SERVICIO Y RALLY</div>

  <section class="top-row">

    <select id="server-select">
      <option value="J1">Saca J1</option>
      <option value="J2">Saca J2</option>
      <option value="R1">Saca R1</option>
      <option value="R2">Saca R2</option>
    </select>

    <select id="serve-number">
      <option value="1">1º</option>
      <option value="2">2º</option>
    </select>

    <select id="serve-direction">
      <option value="">Dir.</option>
      <option value="T">T</option>
      <option value="Cristal">Cristal</option>
      <option value="Centro">Centro</option>
    </select>

    <div class="rally-box">
      <button id="minus-rally">-</button>

      <input
        type="number"
        id="rally-input"
        min="1"
        value="1"
      />

      <button id="plus-rally">+</button>
    </div>

  </section>

  <div class="section-label">RESULTADO DEL PUNTO</div>

  <section class="point-result-row">

    <button
      class="btn selected won"
      data-point-result="WON"
    >
      Ganado
    </button>

    <button
      class="btn lost"
      data-point-result="LOST"
    >
      Perdido
    </button>

  </section>

  <div class="section-label">JUGADOR</div>

  <section class="players-row two-players">

    <button
      class="btn selected"
      data-player="J1"
      data-team="OUR"
    >
      J1
    </button>

    <button
      class="btn"
      data-player="J2"
      data-team="OUR"
    >
      J2
    </button>

  </section>

  <div class="section-label">TIPO FINAL</div>

  <section class="outcome-row">

    <button
      class="btn selected nf"
      data-outcome="UNFORCED_ERROR"
    >
      NF
    </button>

    <button
      class="btn f"
      data-outcome="FORCED_ERROR"
    >
      F
    </button>

    <button
      class="btn w"
      data-outcome="WINNER"
    >
      W
    </button>

  </section>

  <div class="section-label">CATEGORÍA GOLPE</div>

  <section
    class="category-buttons"
    id="category-buttons"
  ></section>

  <div class="section-label">GOLPE</div>

  <section
    class="stroke-buttons"
    id="stroke-buttons"
  ></section>

  <section class="golpe-row">

    <div id="selected-stroke">
      Saque · saque t
    </div>

    <div id="stroke-count">
      0
    </div>

  </section>

  <div class="section-label">ZONA EN PISTA</div>

  <section
    class="court"
    id="padel-court"
  >

    <button
      class="court-zone"
      data-zone="RED"
    >
      RED
    </button>

    <button
      class="court-zone"
      data-zone="MEDIO"
    >
      MEDIO
    </button>

    <button
      class="court-zone"
      data-zone="FONDO"
    >
      FONDO
    </button>

  </section>

  <section
    class="last-event"
    id="last-event"
  >
    Sin eventos
  </section>

  <section class="bottom-row">

    <span>
      Eventos:
      <strong id="event-count">0</strong>
    </span>

    <button id="reset-crono">
      Reset
    </button>

    <button
      id="undo-btn"
      disabled
    >
      Undo
    </button>

    <button
      id="export-btn"
      disabled
    >
      CSV
    </button>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
