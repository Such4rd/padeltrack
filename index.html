<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padel Event Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="app">

    <section class="crono-row">
      <button id="start-crono">▶</button>
      <button id="stop-crono">⏸</button>
      <button id="minus-crono">-1s</button>
      <div id="crono-display">00:00</div>
      <button id="plus-crono">+1s</button>
      <button id="reset-crono">R</button>
    </section>

    <section class="top-row">
      <select id="server-select">
        <option value="J1">Saca J1</option>
        <option value="J2">Saca J2</option>
        <option value="R1">Saca R1</option>
        <option value="R2">Saca R2</option>
      </select>

      <select id="serve-number">
        <option value="1">1º</option>
        <option value="2">2º</option>
      </select>

      <select id="serve-direction">
        <option value="">Dir.</option>
        <option value="T">T</option>
        <option value="Cristal">Cristal</option>
        <option value="Centro">Centro</option>
      </select>

      <input type="number" id="rally-input" min="1" value="1" placeholder="Rally" />
    </section>

    <section class="players-row">
      <button class="btn selected" data-player="J1" data-team="OUR">J1</button>
      <button class="btn" data-player="J2" data-team="OUR">J2</button>
      <button class="btn" data-player="R1" data-team="RIVAL">R1</button>
      <button class="btn" data-player="R2" data-team="RIVAL">R2</button>
    </section>

    <section class="select-row">
      <select id="stroke-category"></select>
    </section>

    <section class="select-row">
      <select id="stroke-subtype"></select>
    </section>

    <section class="outcome-row">
      <button class="btn selected" data-outcome="UNFORCED_ERROR">No forzado</button>
      <button class="btn" data-outcome="FORCED_ERROR">Forzado</button>
      <button class="btn" data-outcome="WINNER">Winner</button>
    </section>

    <section class="court" id="padel-court">
      <button class="court-zone" data-zone="RED">RED</button>
      <button class="court-zone" data-zone="MEDIO">MEDIO</button>
      <button class="court-zone" data-zone="FONDO">FONDO</button>
    </section>

    <section class="bottom-row">
      <span>Eventos: <strong id="event-count">0</strong></span>
      <button id="undo-btn" disabled>Deshacer</button>
      <button id="export-btn" disabled>CSV</button>
    </section>

    <section class="last-event" id="last-event">
      Sin eventos registrados
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
